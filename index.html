<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>关系鉴定科 · 两个人各写一句</title>
<meta name="description" content="两个人各写一句话，谁也不许看谁的。写完一起拆开，看看你们有多像。">
<style>
:root{
  --bg:#EDE8E1;
  --card:#FFFFFF;
  --ink:#1A1614;
  --ink2:#5E554E;
  --ink3:#9C9088;
  --ink4:#C2B8AE;
  --line:#E2DACE;
  --line2:#F0EAE1;
  --red:#C4362B;
  --redbg:#FBF0EE;
  --paper:#FBFAF7;
  --seal:#C4362B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.6;min-height:100vh;padding-bottom:60px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:430px;margin:0 auto;padding:22px 18px 0;}

/* ── 抬头 ── */
.masthead{text-align:center;margin-bottom:14px;}
.masthead .sub{font-size:9.5px;letter-spacing:.4em;color:var(--ink3);margin-bottom:9px;}
.masthead h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.16em;}
.masthead .rule{display:flex;align-items:center;gap:9px;margin:10px 0 8px;}
.masthead .rule i{flex:1;height:1px;background:var(--line);display:block;}
.masthead .rule s{width:5px;height:5px;background:var(--red);display:block;text-decoration:none;transform:rotate(45deg);}

/* ── 一句话规则 ── */
.oneline{text-align:center;margin-bottom:16px;}
.oneline p{margin:0;font-size:15px;line-height:1.85;color:var(--ink);font-weight:600;letter-spacing:.02em;}
.oneline span{display:block;font-size:11px;color:var(--ink3);margin-top:5px;letter-spacing:.05em;}

/* ── 三格图示 ── */
.three{display:flex;align-items:stretch;gap:7px;margin-bottom:16px;}
.three .st{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 8px;text-align:center;
}
.three .st b{display:block;font-size:19px;font-family:"Times New Roman",Georgia,serif;color:var(--red);line-height:1;margin-bottom:6px;}
.three .st span{display:block;font-size:11px;color:var(--ink2);line-height:1.55;letter-spacing:.02em;}
.three .arw{flex:none;display:flex;align-items:center;color:var(--ink4);font-size:12px;}

/* ── 选项卡 ── */
.tabs{display:flex;gap:6px;background:#E4DED4;border-radius:11px;padding:3px;margin-bottom:16px;}
.tabs div{
  flex:1;text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;
  padding:8px 0;border-radius:9px;color:var(--ink2);cursor:pointer;transition:.18s;
}
.tabs div.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(26,22,20,.09);}

/* ── 通用卡 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px;}
.ctitle{font-size:10.5px;font-weight:700;letter-spacing:.22em;color:var(--ink3);margin:0 0 13px;display:flex;align-items:center;gap:7px;}
.ctitle::before{content:"";width:3px;height:11px;background:var(--ink);display:block;}
.ctitle em{margin-left:auto;font-style:normal;letter-spacing:.06em;color:var(--ink4);font-weight:500;}

/* ── 搭档 chips ── */
.pchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -2px;scrollbar-width:none;}
.pchips::-webkit-scrollbar{display:none;}
.pchip{
  flex:none;border:1px solid var(--line);background:var(--paper);border-radius:20px;
  padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;gap:7px;transition:.16s;white-space:nowrap;
}
.pchip.on{border-color:var(--ink);background:var(--ink);color:#fff;}
.pchip.add{border-style:dashed;color:var(--ink3);font-weight:500;}

/* ── 表单 ── */
.field{margin-bottom:11px;}
.flabel{font-size:11.5px;color:var(--ink2);font-weight:700;letter-spacing:.04em;margin-bottom:6px;display:block;}
input[type=text],textarea{
  width:100%;border:1px solid var(--line);background:var(--paper);border-radius:11px;
  padding:11px 12px;font-family:inherit;font-size:14px;line-height:1.6;color:var(--ink);
  outline:none;transition:border-color .18s,background .18s;
}
textarea{resize:none;min-height:96px;}
input[type=text]:focus,textarea:focus{border-color:var(--ink);background:#fff;}
textarea::placeholder,input::placeholder{color:#C6BCB2;}

.btn{
  width:100%;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:14.5px;
  font-weight:700;letter-spacing:.14em;padding:14px;border-radius:13px;cursor:pointer;
  transition:transform .12s,opacity .18s;margin-top:4px;
}
.btn:active{transform:scale(.975);}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-size:12.5px;font-weight:600;padding:11px;letter-spacing:.08em;}
.btn.red{background:var(--red);}
.btn:disabled{opacity:.38;cursor:default;}
.btn:disabled:active{transform:none;}

/* ── 写话 ── */
.who{
  display:flex;align-items:center;gap:8px;background:var(--redbg);border:1px solid #F0DFDA;
  border-radius:10px;padding:9px 12px;margin-bottom:13px;
}
.who i{
  width:20px;height:20px;flex:none;border-radius:50%;background:var(--red);color:#fff;
  font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;
  justify-content:center;letter-spacing:0;
}
.who b{font-size:12.5px;letter-spacing:.04em;}
.who span{margin-left:auto;font-size:10px;color:var(--ink3);letter-spacing:.06em;}

.stepbar{display:flex;align-items:center;gap:6px;margin-bottom:15px;}
.stepbar i{flex:1;height:2px;background:var(--line2);display:block;border-radius:2px;}
.stepbar i.on{background:var(--ink);}
.stepbar u{text-decoration:none;font-size:9.5px;color:var(--ink4);letter-spacing:.1em;flex:none;}
.stepbar u.on{color:var(--ink);font-weight:700;}

.sealed{
  border:1px dashed var(--ink4);background:var(--paper);border-radius:11px;padding:13px 12px;
  margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.sealed .lk{font-size:15px;opacity:.55;}
.sealed div{flex:1;min-width:0;}
.sealed b{display:block;font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.24em;}
.sealed span{display:block;font-size:10px;color:var(--ink4);margin-top:2px;}

.warn{
  background:#FFF4E5;border:1px dashed #D0392A;border-radius:8px;
  padding:10px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.75;
  color:#8A3A18;text-align:left;
}
.warn b{color:#D0392A;}
.warn .go{
  display:inline-block;margin-top:7px;padding:5px 10px;border-radius:6px;
  background:#D0392A;color:#fff;font-size:12px;letter-spacing:.5px;
}
.tip{
  font-size:11.5px;color:var(--ink2);line-height:1.8;background:var(--paper);
  border:1px solid var(--line2);border-radius:10px;padding:11px 12px;margin-bottom:12px;
}
.tip b{color:var(--ink);}

/* ── 信封 / 房间码 ── */
.codebox{
  text-align:center;background:var(--paper);border:1px dashed var(--ink4);
  border-radius:14px;padding:17px 12px 15px;margin-bottom:12px;
}
.codebox .lb{font-size:10px;letter-spacing:.24em;color:var(--ink3);margin-bottom:9px;}
.codebox .num{
  font-family:"Times New Roman",Georgia,serif;font-size:42px;font-weight:700;
  letter-spacing:.3em;line-height:1;color:var(--red);text-indent:.3em;
  font-variant-numeric:tabular-nums;
}
.codebox .sub{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.75;}
.linkbox{
  display:flex;gap:8px;align-items:center;margin-bottom:11px;
}
.linkbox input{
  flex:1;min-width:0;font-size:11px;padding:9px 10px;color:var(--ink3);
  background:var(--paper);border:1px solid var(--line);border-radius:10px;
}
.linkbox button{
  flex:none;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:12px;
  font-weight:700;letter-spacing:.1em;padding:9px 14px;border-radius:10px;cursor:pointer;
}
.linkbox button:active{transform:scale(.96);}

/* ── 解锁 ── */
.unlockbox{text-align:center;padding:6px 0 2px;}
.unlockbox .ic{font-size:34px;line-height:1;margin-bottom:10px;}
.unlockbox .t{font-size:15px;font-weight:700;margin-bottom:5px;}
.unlockbox .s{font-size:11.5px;color:var(--ink3);line-height:1.8;margin-bottom:15px;}
.codein{
  display:flex;gap:8px;justify-content:center;margin-bottom:6px;
}
.codein input{
  width:52px;text-align:center;font-family:"Times New Roman",Georgia,serif;
  font-size:26px;font-weight:700;letter-spacing:0;padding:11px 0;
  border:1px solid var(--line);background:var(--paper);border-radius:11px;
}
.codein input:focus{border-color:var(--ink);background:#fff;}
.err{font-size:11.5px;color:var(--red);min-height:18px;margin-bottom:6px;}

/* ── 报告 ── */
.report{position:relative;background:var(--card);border:1px solid var(--ink);border-radius:4px;overflow:hidden;margin-bottom:12px;}
.report .topband{height:3px;background:var(--red);}
.report .head{display:flex;justify-content:space-between;align-items:flex-start;padding:15px 16px 0;}
.report .no{font-size:9px;letter-spacing:.14em;color:var(--ink3);line-height:1.6;font-variant-numeric:tabular-nums;}
.stamp{border:1.6px solid var(--red);color:var(--red);border-radius:6px;padding:3px 7px;font-size:9px;font-weight:700;letter-spacing:.12em;transform:rotate(-7deg);opacity:.92;white-space:nowrap;}

.quotes{margin:14px 16px 0;display:grid;gap:8px;}
.qt{border:1px solid var(--line2);border-radius:11px;padding:11px 12px;background:var(--paper);}
.qt .lab{font-size:9px;letter-spacing:.2em;color:var(--ink3);margin-bottom:6px;display:flex;justify-content:space-between;}
.qt p{margin:0;font-size:13.5px;line-height:1.72;color:var(--ink);word-break:break-word;}
.qt p.none{color:var(--ink4);font-style:italic;}

.scorezone{text-align:center;padding:18px 16px 4px;}
.scorezone .label{font-size:9.5px;letter-spacing:.3em;color:var(--ink3);margin-bottom:7px;}
.bignum{font-family:"Times New Roman",Georgia,serif;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--ink);font-size:74px;font-variant-numeric:tabular-nums;}
.bignum.long{font-size:38px;letter-spacing:-.01em;}
.bignum.mid{font-size:56px;}
.scorezone .unit{font-size:11px;color:var(--ink3);letter-spacing:.24em;margin-top:9px;}
.scalebar{margin:14px auto 0;height:3px;width:calc(100% - 32px);background:var(--line2);position:relative;border-radius:2px;}
.scalebar span{position:absolute;top:-4px;width:11px;height:11px;background:var(--red);border-radius:50%;border:2px solid #fff;}

.verdict{padding:17px 20px 19px;text-align:center;border-top:1px dashed var(--line);margin:16px 16px 0;}
.verdict p{margin:0;font-size:17px;font-weight:700;line-height:1.62;letter-spacing:.02em;}

/* ── 三项 ── */
.dims{margin:0 16px 4px;border-top:1px solid var(--line2);padding-top:15px;}
.dimsh{font-size:10px;letter-spacing:.2em;color:var(--ink3);font-weight:700;margin-bottom:13px;}
.dim{margin-bottom:15px;}
.dim:last-child{margin-bottom:4px;}
.dim .top{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.dim .dn{font-size:13px;color:var(--ink);font-weight:700;letter-spacing:.01em;}
.dim .lv{
  margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;
  padding:2px 9px;border-radius:20px;background:var(--paper);border:1px solid var(--line);color:var(--ink2);flex:none;
}
.dim .lv.hi{background:var(--ink);border-color:var(--ink);color:#fff;}
.dim .lv.lo{background:var(--redbg);border-color:#F0DFDA;color:var(--red);}
.dim .db{flex-basis:100%;height:5px;background:var(--line2);border-radius:3px;overflow:hidden;}
.dim .db i{display:block;height:100%;background:var(--ink);border-radius:3px;}
.dim .note{font-size:12px;color:var(--ink2);line-height:1.75;margin-top:7px;}
.dim .term{font-size:9.5px;color:var(--ink4);letter-spacing:.1em;margin-top:5px;}

/* ── 合计 ── */
.sum{margin:0 16px 12px;background:var(--paper);border:1px solid var(--line2);border-radius:11px;padding:13px 14px;}
.sum .nums{font-size:12px;color:var(--ink2);letter-spacing:.02em;}
.sum .nums b{font-family:"Times New Roman",Georgia,serif;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.sum .fin{font-size:14px;font-weight:700;margin-top:8px;padding-top:9px;border-top:1px dashed var(--line);letter-spacing:.02em;}
.sum .fin b{font-family:"Times New Roman",Georgia,serif;font-size:20px;color:var(--red);font-variant-numeric:tabular-nums;}
.sum .why{font-size:12px;color:var(--ink2);line-height:1.75;margin-top:7px;}

.basis{margin:0 16px 14px;background:var(--paper);border:1px solid var(--line2);border-radius:11px;padding:13px 14px;}
.basis h4{margin:0 0 8px;font-size:9.5px;letter-spacing:.2em;color:var(--ink3);font-weight:700;}
.basis ul{margin:0;padding:0;list-style:none;}
.basis li{font-size:12px;color:var(--ink2);line-height:1.75;padding-left:11px;position:relative;}
.basis li::before{content:"—";position:absolute;left:0;color:var(--ink4);}
.basis .fm{font-size:10px;color:var(--ink4);margin-top:9px;letter-spacing:.04em;}

.acts{padding:0 16px 16px;display:flex;gap:8px;}
.acts button{flex:1;}

/* ── 存档条 ── */
.saverow{margin:0 16px 16px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;}
.saverow .st{font-size:12px;font-weight:700;margin-bottom:9px;}
.saverow input{margin-bottom:9px;}
.saverow .rel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
.saverow .rel span{
  font-size:11px;padding:5px 11px;border:1px solid var(--line);border-radius:16px;
  color:var(--ink2);cursor:pointer;background:#fff;
}
.saverow .rel span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.saverow .done{font-size:12px;color:var(--ink2);text-align:center;padding:4px 0;}
.saverow .done b{color:var(--ink);}

/* ── 档案 ── */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:11px;overflow:hidden;}
.pcard .ph{padding:15px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;}
.pcard .av{width:36px;height:36px;flex:none;border-radius:12px;background:var(--redbg);border:1px solid #F0DFDA;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:14px;font-weight:800;}
.pcard .info{flex:1;min-width:0;}
.pcard .info b{display:block;font-size:14.5px;letter-spacing:.04em;}
.pcard .info span{display:block;font-size:10px;color:var(--ink3);letter-spacing:.06em;margin-top:2px;}
.pcard .arrow{color:var(--ink4);font-size:15px;flex:none;transition:transform .2s;}
.pcard.open .arrow{transform:rotate(90deg);}
.pcard .body{display:none;border-top:1px solid var(--line2);padding:14px 16px;}
.pcard.open .body{display:block;}
svg.spark{display:block;width:100%;height:auto;}
.hrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dotted var(--line);cursor:pointer;}
.hrow:last-child{border-bottom:none;}
.hrow .d{font-size:10px;color:var(--ink3);width:44px;flex:none;font-variant-numeric:tabular-nums;}
.hrow .v{font-family:"Times New Roman",Georgia,serif;font-weight:700;font-size:15px;width:62px;flex:none;font-variant-numeric:tabular-nums;}
.hrow .v.long{font-size:11.5px;}
.hrow .t{flex:1;min-width:0;font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.del{margin-top:11px;font-size:10.5px;color:var(--ink4);letter-spacing:.1em;background:none;border:none;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0;}

/* ── 搭档档案详情 ── */
.pdet .ptop{padding:16px 16px 12px;display:flex;align-items:center;gap:12px;}
.pdet .ptop .av{width:44px;height:44px;flex:none;border-radius:14px;background:var(--redbg);border:1px solid #F0DFDA;display:flex;align-items:center;justify-content:center;color:var(--red);font-size:17px;font-weight:800;}
.pdet .ptop .info{flex:1;min-width:0;}
.pdet .ptop b{display:block;font-size:17px;letter-spacing:.05em;}
.pdet .ptop span{display:block;font-size:10.5px;color:var(--ink3);letter-spacing:.07em;margin-top:3px;}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 4px;}
.statgrid .s{background:var(--paper);border:1px solid var(--line2);border-radius:11px;padding:10px 4px 9px;text-align:center;}
.statgrid .s b{display:block;font-family:"Times New Roman",Georgia,serif;font-weight:700;font-size:18px;line-height:1.25;font-variant-numeric:tabular-nums;}
.statgrid .s b.sm{font-size:14.5px;}
.statgrid .s span{display:block;font-size:9.5px;color:var(--ink3);letter-spacing:.1em;margin-top:3px;}
.trend{margin:12px 16px 0;font-size:12px;color:var(--ink2);line-height:1.85;background:var(--paper);border:1px solid var(--line2);border-radius:11px;padding:11px 13px;}
.trend b{font-family:"Times New Roman",Georgia,serif;font-size:14.5px;}
.sech{margin:18px 16px 2px;font-size:9.5px;letter-spacing:.2em;color:var(--ink3);font-weight:700;}
.pdet .hrows{margin:0 16px;}
.morelink{display:block;width:100%;text-align:center;font-size:11px;letter-spacing:.12em;color:var(--ink3);background:var(--paper);border:1px solid var(--line2);border-radius:9px;padding:8px 0;margin-top:10px;font-family:inherit;cursor:pointer;}
.morelink:hover{color:var(--ink);}

/* ── 分享卡片 ── */
.sharebox{margin:0 16px 12px;}
.sharebox img{width:100%;display:block;border-radius:13px;border:1px solid var(--line);background:#fff;}
.sharebox .ph{width:100%;border-radius:13px;border:1px solid var(--line);background:var(--paper);color:var(--ink4);font-size:11.5px;padding:40px 0;text-align:center;}
.chiprow{display:flex;gap:7px;margin:0 16px 12px;}
.chiprow span{flex:1;text-align:center;font-size:11.5px;padding:8px 4px;border:1px solid var(--line);border-radius:20px;color:var(--ink2);background:#fff;cursor:pointer;}
.chiprow span.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.sharetip{margin:0 16px 14px;font-size:11px;color:var(--ink3);line-height:1.8;text-align:center;}

.empty{text-align:center;padding:26px 10px 12px;color:var(--ink3);font-size:12.5px;line-height:1.95;}
.empty .em{font-size:26px;display:block;margin-bottom:8px;opacity:.45;}

.foot{text-align:center;color:var(--ink3);font-size:10px;line-height:1.9;padding:6px 8px 0;letter-spacing:.03em;}
.foot b{color:var(--ink2);font-weight:600;}

.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);background:var(--ink);
  color:#fff;font-size:12.5px;letter-spacing:.05em;padding:11px 20px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:99;
  max-width:86vw;text-align:center;line-height:1.6;
}
.toast.on{opacity:1;transform:translate(-50%,0);}

.fadein{animation:fi .38s cubic-bezier(.22,.9,.3,1) both;}
@keyframes fi{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.pop{animation:pop .45s cubic-bezier(.2,1.06,.3,1) both;}
@keyframes pop{from{opacity:0;transform:scale(.955);}to{opacity:1;transform:none;}}
.unfold{animation:uf .5s cubic-bezier(.2,.9,.3,1) both;}
.unfold.d2{animation-delay:.12s;}
@keyframes uf{from{opacity:0;transform:translateY(-7px);clip-path:inset(0 0 100% 0);}to{opacity:1;transform:none;clip-path:inset(0 0 0 0);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="sub">MUTUAL BLIND APPRAISAL</div>
    <h1>关系鉴定科</h1>
    <div class="rule"><i></i><s></s><i></i></div>
  </div>
  <div class="tabs">
    <div id="tabToday" class="on">开 始</div>
    <div id="tabArc">档 案</div>
  </div>
  <div id="app"></div>

      else if(hb.length) oNote = "TA 用了「" + hb.slice(0, 2).join("」「") + "」，你什么都没加。一个在喊，一个在打字。";
      else oNote = "你们都没用什么感叹号，也没加语气词。两个人今天都很平静。";
    }
    oLv = rawO >= 62 ? "很像" : (rawO >= 30 ? "还行" : "不太像");
  }
  dims.push({
    key: "tone", q: "你们说话的口气像不像？", short: "口气", term: "情绪同步率", w: 0.30,
    v: lift(rawO), note: oNote, lv: oLv, weak: weak
  });

  return dims;
}

/* ══════════════ 鉴定引擎 ══════════════ */
function hash(str){
  var h = 2166136261;
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h = (h * 16777619) >>> 0;
  }
  return h >>> 0;
}
function mix(a, b){
  var h = a ^ (b + 0x9e3779b9);
  h = (h ^ (h >>> 16)) >>> 0;
  h = Math.imul(h, 0x85ebca6b) >>> 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function pick(arr, seed){ return arr[seed % arr.length]; }

function appraise(a, b, dateKey, pid, relation){
  var f = features(a, b);
  var dims = buildDims(f);

  /* 权重：某一项没测时，权重分给其余项 */
  var live = dims.filter(function(d){ return !d.weak; });
  var wsum = live.reduce(function(s, d){ return s + d.w; }, 0);
  var score = 0;
  for(var i = 0; i < live.length; i++){
    score += live[i].v * (live[i].w / wsum);
  }
  score = clamp(score, 65, 100);

  var seed = mix(hash(String(a) + "\u0001" + String(b)), hash(String(dateKey) + "\u0002" + String(pid) + "\u0003" + String(relation)));
  /* 大多时候只留两位小数；偶尔不修约，让分数露出长长的小数尾巴 */
  var longMode = (seed % 17 === 0);
  score = longMode ? Math.round(score * 1e6) / 1e6 : Math.round(score * 100) / 100;
  for(var dj = 0; dj < dims.length; dj++) dims[dj].v = Math.round(dims[dj].v * 10) / 10;

  var pool = score >= 84 ? HIGH : (score >= 73 ? MID : LOW);
  if(/爱|喜欢|想你|在乎|嫁|娶/.test(String(a) + String(b)) && pool === LOW) pool = MID;

  var verdict;
  if(f.bothEmpty) verdict = "两个人都不说话，但都还在这里，这本身就是一种默契。";
  else verdict = pick(pool, seed);

  /* 还注意到 */
  var basis = [], all = String(a) + String(b);
  if(f.words.length) basis.push("你们都提到了「" + f.words[0] + "」。");
  var q = (all.match(/[?？吗呢]/g) || []).length;
  if(q > 0) basis.push("有人在试探，有人在接。");
  if((all.indexOf("…") > -1) || (all.indexOf("...") > -1)) basis.push("有话没说完，写到一半收住了。");
  if(emojiCount(all) > 0) basis.push("用到了表情。冲突风险低于平均值。");
  if(all.indexOf("晚安") > -1) basis.push("「晚安」今日在场。");
  if(/爱|喜欢|想你/.test(all)) basis.push("有人说出了直给的话。仪器需要冷静三秒，已跳过。");
  if(/别|不要|算了/.test(all)) basis.push("省略了铺垫环节，说明彼此已经懒得客气。");
  if((all.match(/哈/g) || []).length >= 3) basis.push("笑了好几次，其中真笑次数不予公布。");
  if(f.sameChar === 0 && f.total > 0) basis.push("用词零重叠。这是在各自星球上写的两句话。");
  if(basis.length === 0) basis.push("样本规整，没检出异常。这本身值得记一笔。");
  if(basis.length < 2) basis.push("建议明天再测一次，好有个对照。");

  /* 归因 */
  var sorted = live.slice().sort(function(x, y){ return y.v - x.v; });
  var why;
  var names = ["零", "一", "两", "三"];
  var hi = sorted[0], lo = sorted[sorted.length - 1];
  var cnt = names[Math.min(live.length, 3)];
  if(!hi) why = "今天几乎没有能比的东西。";
  else if(hi.v - lo.v < 5) why = cnt + "项都差不多，没有哪一项特别突出。";
  else why = "主要是「" + hi.short + "」把分数拉上去的，「" + lo.short + "」拖了点后腿。";

  var note = pick(NOTE, mix(seed, hash(dateKey)));

  return {
    score: score, dims: dims, basis: basis, verdict: verdict, why: why, note: note, long: longMode,
    a: a, b: b, date: dateKey, pid: pid || "", relation: relation || "unknown",
    no: "NO." + String(seed % 900000 + 100000),
    code: ""
  };
}

function sparkline(recs){
  var keys = Object.keys(recs).sort().slice(-7);
  if(keys.length < 2) return "";
  var W = 358, H = 92, P = 8, lo = 65, hi = 100;
  var pts = keys.map(function(k, i){
    var v = clamp(recs[k].score, lo, hi);
    var x = P + i * (W - P * 2) / (keys.length - 1);
    var y = H - 18 - (v - lo) / (hi - lo) * (H - 34);
    return [x, y, recs[k].score, k];
  });
  var poly = pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var dots = pts.map(function(p){
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.2" fill="#1A1614"/>';
  }).join("");
  var labs = pts.map(function(p){
    return '<text x="' + p[0].toFixed(1) + '" y="' + (H - 3) + '" font-size="8" fill="#9C9088" text-anchor="middle">' +
      (+p[3].slice(4,6)) + "/" + (+p[3].slice(6,8)) + '</text>';
  }).join("");
  var vals = pts.map(function(p){
    return '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 9).toFixed(1) + '" font-size="9" font-weight="700" fill="#1A1614" text-anchor="middle" font-family="Georgia,serif">' +
      p[2].toFixed(1) + '</text>';
  }).join("");
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="' + P + '" y1="' + (H - 18) + '" x2="' + (W - P) + '" y2="' + (H - 18) + '" stroke="#F0EAE1" stroke-width="1"/>' +
    '<polyline points="' + poly + '" fill="none" stroke="#1A1614" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labs + vals + '</svg>';
}

/* ── 档案详情：一个人的完整走势 ── */
function dayBefore(k){
  var y = +k.slice(0,4), m = +k.slice(4,6), d = +k.slice(6,8);
  var t = new Date(y, m - 1, d);
  t.setDate(t.getDate() - 1);
  var mm = t.getMonth() + 1, dd = t.getDate();
  return String(t.getFullYear()) + (mm < 10 ? "0" : "") + mm + (dd < 10 ? "0" : "") + dd;
}
function streakOf(desc){
  var n = 1;
  for(var i = 0; i < desc.length - 1; i++){
    if(dayBefore(desc[i]) === desc[i + 1]) n++; else break;
  }
  return n;
}
function bigChart(recs, asc){
  if(asc.length < 2) return "";
  var k = asc.slice(-30);
  var W = 358, H = 138, PL = 30, PR = 12, PT = 18, PB = 24, lo = 65, hi = 100;
  var X = function(i){ return PL + i * (W - PL - PR) / (k.length - 1); };
  var Y = function(v){ return PT + (1 - (clamp(v, lo, hi) - lo) / (hi - lo)) * (H - PT - PB); };
  var pts = k.map(function(d, i){ return [X(i), Y(recs[d].score), recs[d].score, d]; });
  var poly = pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var area = "M" + pts[0][0].toFixed(1) + "," + (H - PB) + " L" + poly.split(" ").join(" L") +
             " L" + pts[pts.length - 1][0].toFixed(1) + "," + (H - PB) + " Z";
  var grid = [70, 80, 90, 100].map(function(v){
    return '<line x1="' + PL + '" y1="' + Y(v) + '" x2="' + (W - PR) + '" y2="' + Y(v) +
      '" stroke="' + (v === 100 ? "#E6DED3" : "#F1EBE3") + '" stroke-width="1"/>' +
      '<text x="' + (PL - 6) + '" y="' + (Y(v) + 3) + '" font-size="8" fill="#B5A99F" text-anchor="end">' + v + '</text>';
  }).join("");
  var dots = pts.map(function(p){
    return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="#1A1614"/>';
  }).join("");
  var step = Math.ceil(k.length / 6);
  var labs = pts.map(function(p, i){
    if(i % step !== 0 && i !== pts.length - 1) return "";
    return '<text x="' + p[0].toFixed(1) + '" y="' + (H - 8) + '" font-size="8" fill="#9C9088" text-anchor="middle">' +
      (+p[3].slice(4,6)) + "/" + (+p[3].slice(6,8)) + '</text>';
  }).join("");
  var lastP = pts[pts.length - 1];
  var mark = '<text x="' + lastP[0].toFixed(1) + '" y="' + (lastP[1] - 10).toFixed(1) +
    '" font-size="10" font-weight="700" fill="#D0392A" text-anchor="end" font-family="Georgia,serif">' +
    lastP[2].toFixed(1) + '</text>';
  return '<svg class="spark big" viewBox="0 0 ' + W + ' ' + H + '">' +
    grid +
    '<path d="' + area + '" fill="#E9E1D6" opacity=".55"/>' +
    '<polyline points="' + poly + '" fill="none" stroke="#1A1614" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labs + mark + '</svg>';
}
function viewPDetail(){
  var db = load();
  var p = null;
  for(var i = 0; i < db.partners.length; i++) if(db.partners[i].id === S.detailPid) p = db.partners[i];
  if(!p){
    return '<div class="card"><div class="empty">这个人已经不在档案里了</div>' +
      '<div class="acts"><button class="btn ghost" data-act="toArchive">回 档 案</button></div></div>';
  }
  var recs = p.records || {};
  var asc = Object.keys(recs).sort(), desc = asc.slice().reverse();
  var n = asc.length;
  if(!n){
    return '<div class="card pdet">' +
      '<div class="ptop"><div class="av">' + esc(chars(p.name)[0] || "?") + '</div>' +
      '<div class="info"><b>' + esc(p.name) + '</b><span>' + relName(p.relation) + ' · 还没有记录</span></div></div>' +
      '<div class="empty">还没跟 TA 测过</div>' +
      '<div class="acts"><button class="btn ghost" data-act="toArchive">回 档 案</button>' +
      '<button class="btn ghost" data-act="restart">去 测 一 次</button></div></div>';
  }
  var sum = asc.reduce(function(s, k){ return s + recs[k].score; }, 0);
  var avg = sum / n;
  var hiK = asc.reduce(function(a, k){ return recs[k].score > recs[a].score ? k : a; }, asc[0]);
  var loK = asc.reduce(function(a, k){ return recs[k].score < recs[a].score ? k : a; }, asc[0]);
  var last = desc[0], prev = desc[1];
  var st = streakOf(desc);
  var span = n > 1 ? Math.round((new Date(+asc[n-1].slice(0,4), +asc[n-1].slice(4,6)-1, +asc[n-1].slice(6,8)) -
    new Date(+asc[0].slice(0,4), +asc[0].slice(4,6)-1, +asc[0].slice(6,8))) / 86400000) + 1 : 1;

  var trend;
  if(n === 1){
    trend = "这是你们的第一份。<b>多测几次</b>才看得出走势。";
  } else {
    var dv = recs[last].score - recs[prev].score;
    trend = "最近一次 <b>" + scoreText(recs[last].score) + "</b>（" + md(last) + "），比上一次" +
      (Math.abs(dv) < 0.05 ? "没什么变化" : (dv > 0 ? "高 <b>" + dv.toFixed(1) + "</b>" : "低 <b>" + Math.abs(dv).toFixed(1) + "</b>")) +
      "。<br>从头到尾 " + span + " 天，一共 " + n + " 次。";
  }

  var stat = function(v, lab, sm){
    return '<div class="s"><b class="' + (sm ? "sm" : "") + '">' + v + '</b><span>' + lab + '</span></div>';
  };

  return '<div class="card pdet">' +
    '<div class="ptop">' +
      '<div class="av">' + esc(chars(p.name)[0] || "?") + '</div>' +
      '<div class="info"><b>' + esc(p.name) + '</b>' +
      '<span>' + relName(p.relation) + ' · 从 ' + md(asc[0]) + ' 开始</span></div>' +
    '</div>' +
    '<div class="statgrid">' +
      stat(scoreText(avg), "平 均 分") +
      stat(n, "一 共 几 次") +
      stat(st + " 天", st > 1 ? "连 着 测 了" : "最 近 一 次", true) +
      stat(scoreText(recs[hiK].score), "最 高 " + md(hiK)) +
      stat(scoreText(recs[loK].score), "最 低 " + md(loK)) +
      stat((recs[hiK].score - recs[loK].score).toFixed(1), "最 大 起 伏") +
    '</div>' +
    '<div class="trend">' + trend + '</div>' +
    (n > 1 ? '<div class="sech">分 数 走 势</div><div style="margin:0 16px">' + bigChart(recs, asc) + '</div>' : '') +
    '<div class="sech">每 一 次</div>' +
    '<div class="hrows">' + desc.map(function(k){
      var r = recs[k], v = scoreText(r.score);
      return '<div class="hrow" data-act="viewOld" data-pid="' + p.id + '" data-date="' + k + '">' +
        '<div class="d">' + md(k) + '</div>' +
        '<div class="v' + (v.length > 5 ? " long" : "") + '">' + v + '</div>' +
        '<div class="t">' + esc(r.verdict) + '</div>' +
      '</div>';
    }).join("") + '</div>' +
    '<div style="padding:0 16px 16px">' +
      '<button class="morelink" data-act="toArchive">返 回 档 案</button>' +
      '<button class="del" style="margin-top:12px;display:block;margin-left:auto;margin-right:auto" data-act="delP" data-id="' + p.id + '">删 掉 这 个 人</button>' +
    '</div>' +
  '</div>';
}

/* ══════════════ 分享卡片（canvas 画，纯前端） ══════════════ */
var F_SANS = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Helvetica,Arial,sans-serif';
var F_SERIF = 'Georgia,"Times New Roman",serif';
function wrapLines(ctx, text, maxW){
  var out = [], line = "";
  text = String(text || "");
  for(var i = 0; i < text.length; i++){
    var ch = text.charAt(i);
    if(ch === "\n"){ out.push(line); line = ""; continue; }
    if(line && ctx.measureText(line + ch).width > maxW){ out.push(line); line = ch; }
    else line += ch;
  }
  if(line) out.push(line);
  return out;
}
function spWidth(ctx, text, sp){
  var w = 0;
  for(var i = 0; i < text.length; i++) w += ctx.measureText(text.charAt(i)).width + sp;
  return w - sp;
}
function spText(ctx, text, x, y, sp, align){
  var w = spWidth(ctx, text, sp);
  var cx = (align === "center") ? x - w / 2 : (align === "right" ? x - w : x);
  for(var i = 0; i < text.length; i++){
    var ch = text.charAt(i);
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + sp;
  }
  return w;
}
function drawQR(ctx, x, y, size){
  var n = QRN, m = size / n;
  ctx.fillStyle = "#FFFFFF";
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = "#1A1614";
  for(var r = 0; r < n; r++){
    for(var c = 0; c < n; c++){
      if(QR.charAt(r * n + c) === "1") ctx.fillRect(x + c * m, y + r * m, m + 0.6, m + 0.6);
    }
  }
}
function cardDims(r, withQ){
  /* 结论按字数估行数；两句话各最多印 2 行（超出会截断） */
  var vlines = Math.max(1, Math.ceil(String(r.verdict || "").length / 30));
  var qh = 0;
  if(withQ){
    var ql = function(s){
      var t = String(s || "").trim();
      return Math.min(2, Math.max(1, Math.ceil(t.length / 40)));
    };
    qh = (18 + ql(r.a) * 21 + 12) + (18 + ql(r.b) * 21 + 12) + 8;
  }
  return { W: 660, H: 720 + (vlines - 1) * 27 + qh };
}
function drawCard(ctx, r, withQ){
  var D = cardDims(r, withQ), W = D.W, y = 0, M = 46;
  ctx.clearRect(0, 0, W, D.H);
  ctx.fillStyle = "#F2EEE8";
  ctx.fillRect(0, 0, W, D.H);
  ctx.fillStyle = "#1A1614";
  ctx.textBaseline = "alphabetic";

  /* 抬头 */
  ctx.font = '700 19px ' + F_SANS;
  spText(ctx, "关 系 鉴 定 科", M, 54, 4);
  ctx.font = '11px ' + F_SANS;
  ctx.fillStyle = "#9C9088";
  ctx.textAlign = "left";
  ctx.fillText(r.no + "  ·  " + md(r.date), M, 78);

  /* 红色印章 */
  ctx.save();
  ctx.translate(W - M - 52, 46);
  ctx.rotate(-0.13);
  ctx.strokeStyle = "#D0392A"; ctx.lineWidth = 2.2;
  ctx.strokeRect(-44, -22, 88, 44);
  ctx.fillStyle = "#D0392A"; ctx.font = '700 15px ' + F_SANS;
  spText(ctx, "已 鉴 定", 0, 6, 3, "center");
  ctx.restore();

  /* 分数 */
  y = 150;
  ctx.fillStyle = "#9C9088"; ctx.font = '10.5px ' + F_SANS;
  spText(ctx, "默 契 指 数", W / 2, y, 3, "center");
  var st = scoreText(r.score);
  ctx.fillStyle = "#1A1614";
  ctx.font = '700 ' + (st.length > 5 ? 58 : (st.length > 4 ? 68 : 84)) + 'px ' + F_SERIF;
  ctx.textAlign = "center";
  ctx.fillText(st, W / 2, y + (st.length > 5 ? 78 : 86));
  ctx.font = '11px ' + F_SANS; ctx.fillStyle = "#9C9088";
  ctx.fillText("满分 100 · 最低 65", W / 2, y + 108);

  /* 刻度条 */
  var bx = M + 40, bw = W - (M + 40) * 2, by = y + 132;
  ctx.strokeStyle = "#DCD3C7"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + bw, by); ctx.stroke();
  var pos = clamp((r.score - 65) / 35, 0, 1);
  ctx.fillStyle = "#D0392A";
  ctx.beginPath(); ctx.arc(bx + bw * pos, by, 5.5, 0, Math.PI * 2); ctx.fill();

  /* 结论 */
  y = by + 42;
  ctx.fillStyle = "#1A1614"; ctx.font = '16px ' + F_SANS;
  var vl = wrapLines(ctx, r.verdict, W - M * 2);
  for(var i = 0; i < vl.length; i++){
    ctx.fillText(vl[i], W / 2, y + i * 27);
  }
  y += vl.length * 27 + 16;

  /* 两句话 */
  if(withQ){
    var pair = [["你 写 的", r.a], ["TA 写 的", r.b]];
    for(var pi = 0; pi < 2; pi++){
      var lab = pair[pi][0], txt = String(pair[pi][1] || "").trim() || "（这个人一个字都没写）";
      ctx.fillStyle = "#9C9088"; ctx.font = '10px ' + F_SANS; ctx.textAlign = "left";
      spText(ctx, lab, M, y + 2, 2);
      ctx.font = '14px ' + F_SANS; ctx.fillStyle = "#3A3330";
      var lines = wrapLines(ctx, txt, W - M * 2 - 8);
      if(lines.length > 2){ lines = lines.slice(0, 2); lines[1] = lines[1].slice(0, -1) + "…"; }
      for(var li = 0; li < lines.length; li++){
        ctx.fillText(lines[li], M + 2, y + 24 + li * 21);
      }
      ctx.strokeStyle = "#E3DCD2"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(M, y + 10); ctx.lineTo(W - M, y + 10); ctx.stroke();
      y += 18 + lines.length * 21 + 12;
    }
    y += 8;
  }

  /* 三项 */
  ctx.textAlign = "left";
  ctx.fillStyle = "#9C9088"; ctx.font = '10px ' + F_SANS;
  spText(ctx, "我 们 比 了 三 件 事", M, y + 12, 3);
  y += 28;
  for(var di = 0; di < r.dims.length; di++){
    var d = r.dims[di];
    ctx.fillStyle = "#1A1614"; ctx.font = '13px ' + F_SANS;
    ctx.fillText(d.q, M, y + 14);
    ctx.textAlign = "right";
    ctx.fillStyle = d.weak ? "#B5A99F" : (d.v >= 86 ? "#D0392A" : "#3A3330");
    ctx.font = '700 13px ' + F_SANS;
    ctx.fillText(d.weak ? "没测" : d.lv + "  " + scoreText(d.v), W - M, y + 14);
    ctx.textAlign = "left";
    /* 条 */
    var ty = y + 24, tw = W - M * 2;
    ctx.fillStyle = "#E6DED3";
    ctx.fillRect(M, ty, tw, 3);
    if(!d.weak){
      ctx.fillStyle = d.v >= 86 ? "#D0392A" : "#1A1614";
      ctx.fillRect(M, ty, Math.max(6, tw * clamp((d.v - 65) / 35, 0, 1)), 3);
    }
    y += 52;
  }

  /* 页脚：二维码 */
  var fy = D.H - 118;
  ctx.strokeStyle = "#E3DCD2"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(M, fy - 18); ctx.lineTo(W - M, fy - 18); ctx.stroke();
  var qs = 92;
  drawQR(ctx, M, fy, qs);
  ctx.fillStyle = "#1A1614"; ctx.font = '700 14px ' + F_SANS;
  ctx.fillText("扫一扫，你也来测", M + qs + 18, fy + 30);
  ctx.fillStyle = "#3A3330"; ctx.font = '11.5px ' + F_SANS;
  ctx.fillText("两个人，各写一句，", M + qs + 18, fy + 52);
  ctx.fillText("谁也不许看谁的", M + qs + 18, fy + 70);
  ctx.fillStyle = "#B5A99F"; ctx.font = '10px ' + F_SANS;
  ctx.fillText(WEB.replace(/^https?:\/\//, "").replace(/\/$/, ""), M + qs + 18, fy + 90);
  return D.H;
}

function paintShare(){
  var img = document.getElementById("shareImg");
  if(!img || !S.report) return;
  try{
    var D = cardDims(S.report, S.shareQuotes);
    var cv = document.createElement("canvas");
    var sc = 2;
    cv.width = D.W * sc; cv.height = D.H * sc;
    var ctx = cv.getContext("2d");
    if(!ctx){ img.parentNode.innerHTML = '<div class="ph">这个浏览器画不了卡片</div>'; return; }
    ctx.scale(sc, sc);
    drawCard(ctx, S.report, S.shareQuotes);
    S.shareURL = cv.toDataURL("image/png");
    img.src = S.shareURL;
  }catch(e){
    if(img.parentNode) img.parentNode.innerHTML = '<div class="ph">画卡片时出了点问题</div>';

var toastEl = document.getElementById("toast"), toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("on"); }, 2400);
}
function copyText(txt, ok){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast(ok); }, function(){ fallbackCopy(txt, ok); });
  } else { fallbackCopy(txt, ok); }
}
function fallbackCopy(txt, ok){
  var ta = document.createElement("textarea");
  ta.value = txt;
  ta.style.position = "fixed"; ta.style.left = "-9999px";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(ok); }
  catch(e){ toast("复制失败，长按截图也行"); }
  document.body.removeChild(ta);
}

function makeEnvelope(){
  var payload = { a: S.aText, d: todayKey(), n: S.partnerName || "" };
  var pk = packURL("e", JSON.stringify(payload));
  S.code = pk.secret;
  S.pending = { token: pk.token, code: pk.secret, url: pk.url, payload: payload };
  try{ localStorage.setItem(KEY + "_pending", JSON.stringify(S.pending)); }catch(e){}
}

function buildReport(){
  var r = appraise(S.aText, S.bText, todayKey(), S.partnerId || "", S.rel || "unknown");
  S.report = r;
  S.role = "b";
  S.view = "report";
  S.saved = false;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function doSave(){
  var el = document.getElementById("pname");
  var name = el && el.value.trim() ? el.value.trim() : (S.partnerName || "");
  if(!name){ toast("总得给 TA 起个代号吧"); if(el) el.focus(); return; }
  var db = load();
  var p = S.partnerId ? findPartner(db, S.partnerId) : null;
  if(!p){
    for(var i = 0; i < db.partners.length; i++) if(db.partners[i].name === name){ p = db.partners[i]; break; }
  }
  if(!p){
    p = { id: newId(), name: name, relation: S.rel || "unknown", records: {}, created: todayKey() };
    db.partners.push(p);
  }
  p.relation = S.rel || "unknown";
  p.records = p.records || {};
  p.records[todayKey()] = stripRefs(S.report);
  S.partnerId = p.id; S.partnerName = p.name;
  db.lastId = p.id;
  if(!save(db)){ toast("本机存储写入失败，没存上"); return; }
  S.saved = true;
  render();
  toast("存好了");
}

/* 拆开一个信封或一封回信；成功返回 true */
function tryUnlock(token, code){
  var plain = unseal(token, code);
  if(plain === null) return false;
  var obj;
  try{ obj = JSON.parse(plain); }catch(e){ return false; }
  if(!obj) return false;
  S.code = code; S.err = "";
  S.aText = obj.a || ""; S.bText = obj.b || "";
  S.partnerName = obj.n || "";
  if(obj.rel) S.rel = obj.rel;
  if(typeof obj.b === "string"){
    /* 回信：直接看报告 */
    S.role = "a";
    S.report = appraise(S.aText, S.bText, obj.d || todayKey(), S.partnerId || "", S.rel || "unknown");
    S.view = "report"; S.saved = false; S.sentBack = false;
  } else {
    S.role = "b";
    S.view = "writeB";
  }
  return true;
}

function handle(act, el){
  var db = load();
  switch(act){
    case "toA":
      S.aText = ""; S.bText = ""; S.partnerId = null; S.partnerName = ""; S.rel = "unknown";
      S.report = null; S.role = ""; S.saved = false;
      S.view = "writeA"; render();
      break;
    case "pickP": {
      var p = findPartner(db, el.getAttribute("data-id"));
      if(p){ S.partnerId = p.id; S.partnerName = p.name; S.rel = p.relation || "unknown"; }
      S.aText = ""; S.bText = "";
      S.view = "writeA"; render();
      break;
    }
    case "sealA": {
      var ta = document.getElementById("txt");
      S.aText = ta ? ta.value : "";
      if(S.aText.trim() === ""){
        if(!confirm("一个字都没写。空白也算一种样本，确定封起来吗？")) break;
      }
      makeEnvelope();
      S.view = "envelope"; render();
      window.scrollTo({ top: 0 });
      break;
    }
    case "copyLink":
      copyText(S.pending.url, "链接已复制，发给 TA 吧");
      break;
    case "nearby":
      /* 同一部设备接力：跳过链接，直接进入第二步 */
      S.view = "writeB"; render();
      break;
    case "sealB": {
      var tb = document.getElementById("txt");
      S.bText = tb ? tb.value : "";
      if(S.aText.trim() === "" && S.bText.trim() === ""){
        if(!confirm("两个人都不说话。这样也能出报告，确定吗？")) break;
      }
      buildReport();
      break;
    }
    case "sendBack": {
      var pk = packURL("r", JSON.stringify({
        a: S.aText, b: S.bText, d: todayKey(), n: S.partnerName || "", rel: S.rel || "unknown"
      }));
      S.sentBack = true;
      copyText(pk.url, "链接已复制。发给 TA，TA 点开就能看到同一份报告");
      render();
      break;
    }
    case "copy":
      copyReport(S.report);
      break;
    case "restart": {
      /* 换一个人再测：清掉 URL 上的旧信封，回到干净的起点 */
      try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){ try{ location.hash = ""; }catch(e2){} }
      S.hashToken = ""; S.code = ""; S.pending = null;
      S.aText = ""; S.bText = ""; S.report = null;
      S.partnerId = null; S.partnerName = ""; S.rel = "unknown";
      S.role = ""; S.saved = false; S.err = ""; S.backView = "";
      try{ localStorage.removeItem(KEY + "_pending"); }catch(e){}
      sessClear();
      S.view = "home"; render();
      window.scrollTo({ top: 0 });
      break;
    }
    case "home":
      S.view = "home"; S.err = ""; render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    case "clearHash":
      try{ location.hash = ""; }catch(e){}
      S.hashToken = ""; S.view = "home"; S.err = ""; render();
      break;
    case "pickRel":
      S.rel = el.getAttribute("data-rel");
      var box = document.getElementById("relBox");
      if(box){
        Array.prototype.forEach.call(box.children, function(c){
          c.classList.toggle("on", c.getAttribute("data-rel") === S.rel);
        });
      }
      break;
    case "doSave":
      doSave();
      break;
    case "toggleP": {
      var id = el.getAttribute("data-id");
      S.openPartner = (S.openPartner === id) ? null : id;
      render();
      break;
    }
    case "openDetail": {
      S.detailPid = el.getAttribute("data-id");
      S.view = "pdetail"; render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    }
    case "toArchive": {
      S.detailPid = null; S.view = "archive"; render();
      break;
    }
    case "share": {
      if(!S.report){ toast("还没有报告"); break; }
      S.shareFrom = S.view; S.view = "share"; render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
    }
    case "backReport": {
      S.view = (S.shareFrom === "oldReport") ? "oldReport" : "report";
      render();
      break;
    }
    case "qToggle": {
      S.shareQuotes = (el.getAttribute("data-v") === "1");
      render();
      break;
    }
    case "saveImg": {
      if(!S.shareURL){ toast("卡片还没画好"); break; }
      var nm = "关系鉴定科-" + (S.report ? S.report.date : todayKey()) + ".png";
      try{
        var a = document.createElement("a");
        a.href = S.shareURL; a.download = nm;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        toast("已保存，去相册看看");
      }catch(e){ toast("保存失败，长按图片存吧"); }
      break;
    }
    case "viewOld": {
      var pid = el.getAttribute("data-pid"), d = el.getAttribute("data-date");
      var p3 = findPartner(db, pid);
      var rec = p3 && (p3.records || {})[d];
      if(rec){
        S.report = JSON.parse(JSON.stringify(rec));
        S.aText = rec.a; S.bText = rec.b;
        S.partnerId = pid; S.partnerName = p3.name; S.rel = p3.relation;
        S.role = "a"; S.saved = true; S.backView = "";
        S.view = "oldReport"; render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      break;
    }
    case "delP": {
      var did = el.getAttribute("data-id");
      var p4 = findPartner(db, did);
      if(!p4) break;
      if(!confirm("删掉「" + p4.name + "」的全部记录？删了就没了。")) break;
      db.partners = db.partners.filter(function(x){ return x.id !== did; });
      if(S.partnerId === did){ S.partnerId = null; S.partnerName = ""; }
      if(S.openPartner === did) S.openPartner = null;
      if(db.lastId === did) db.lastId = db.partners.length ? db.partners[0].id : null;
      save(db); S.view = "archive"; render();
      toast("删掉了");
      break;
    }
  }
}

function copyReport(r){
  if(!r) return;
  var txt =
    "【关系鉴定科】\n" + r.no + " / " + md(r.date) + "\n" +
    "──────────\n" +
    "你写的：" + (String(r.a).trim() || "（没写）") + "\n" +
    "TA 写的：" + (String(r.b).trim() || "（没写）") + "\n" +
    "──────────\n" +
    "默契指数：" + scoreText(r.score) + " / 100\n" +
    r.verdict + "\n" +
    "──────────\n" +
    r.dims.map(function(d){ return d.q + "　" + d.lv + "\n  " + d.note; }).join("\n") + "\n" +
    "──────────\n" +
    "三项合起来：" + scoreText(r.score) + "\n" +
    r.why + "\n" +
    "──────────\n" +
    "本工具不构成任何关于感情的建议，也不打算构成。";
  copyText(txt, "已复制，去粘给 TA 看");
}

app.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  handle(t.getAttribute("data-act"), t);
});
/* 离开输入框前，先把正在打的字收进状态里 */
function syncInput(){
  var ta = document.getElementById("txt");
  if(!ta) return;
  if(S.view === "writeA") S.aText = ta.value;
  else if(S.view === "writeB") S.bText = ta.value;
}
document.getElementById("tabToday").addEventListener("click", function(){
  var back = S.backView;
  S.backView = "";
  if(back && back !== "archive" && back !== "home"){
    var alive = true;
    if(back === "envelope" && !S.pending) alive = false;
    if((back === "report" || back === "oldReport") && !S.report) alive = false;
    if(alive){ S.view = back; render(); window.scrollTo({ top: 0 }); return; }
  }
  S.view = "home"; render();
});
document.getElementById("tabArc").addEventListener("click", function(){
  if(S.view !== "archive") S.backView = S.view;
  syncInput();
  S.view = "archive"; render();
});
app.addEventListener("input", function(e){
  var t = e.target;
  if(!t || t.id !== "txt") return;
  if(S.view === "writeA") S.aText = t.value;
  else if(S.view === "writeB") S.bText = t.value;
  sessSave();
});
app.addEventListener("keydown", function(e){
  if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){
    if(S.view === "writeA") handle("sealA");
    if(S.view === "writeB") handle("sealB");
  }
});

/* ══════════════ 入口：判断是不是别人发来的链接 ══════════════ */
function loadPending(){
  try{
    var pd = localStorage.getItem(KEY + "_pending");
    if(!pd) return null;
    var o = JSON.parse(pd);
    return (o && o.token) ? o : null;
  }catch(e){ return null; }
}
/* 同一条链接刷新后，把写了一半的话和已存档状态接回来 */
function sessResume(sess, token){
  if(!sess || sess.hashToken !== token) return;
  if(S.view === "writeB" && sess.bText) S.bText = sess.bText;
  if(S.view === "report"){
    S.saved = !!sess.saved; S.sentBack = !!sess.sentBack;
    if(sess.partnerName) S.partnerName = sess.partnerName;
    S.partnerId = sess.partnerId || null;
  }
}
function boot(){
  S.pending = loadPending();
  var sess = sessLoad();
  var h = location.hash.replace(/^#/, "").trim();
  var pk = unpackHash(h);

  if(h && !pk){ S.view = "broken"; render(); return; }

  if(pk){
    /* 是自己发出去的信封链接：回信封页 */
    if(S.pending && S.pending.token === pk.token){
      S.code = S.pending.code || "";
      S.aText = S.pending.payload.a || "";
      S.partnerName = S.pending.payload.n || "";
      S.view = "envelope"; render(); return;
    }
    /* 别人发来的：钥匙就在链接里，直接拆，不用输密码 */
    if(tryUnlock(pk.token, pk.secret)){
      S.hashToken = pk.token; S.backView = "";
      sessResume(sess, pk.token);
      render(); window.scrollTo({ top: 0 });
      return;
    }
    S.view = "broken"; render(); return;
  }
  /* 没有信封链接：恢复本机上次的进度 */
  if(sess && sessApply(sess)){ render(); return; }
  if(S.pending){
    S.code = S.pending.code || "";
    S.aText = S.pending.payload.a || "";
    S.partnerName = S.pending.payload.n || "";
    S.view = "envelope"; render(); return;
  }
  render();
}
boot();

window.addEventListener("hashchange", function(){
  /* 别人发来的新链接：在同一页面里直接切换，不再等手动刷新 */
  S.err = ""; S.report = null; S.role = "";
  S.saved = false; S.sentBack = false; S.backView = "";
  S.aText = ""; S.bText = "";
  boot();
  window.scrollTo({ top: 0 });
});

window.__moqi = { appraise: appraise, features: features, buildDims: buildDims, seal: seal, unseal: unseal, scoreText: scoreText,
  S: S, handle: handle, render: render, load: load, save: save, viewPDetail: viewPDetail, viewShare: viewShare,
  drawCard: drawCard, cardDims: cardDims, QR: QR, QRN: QRN, bigChart: bigChart, streakOf: streakOf, dayBefore: dayBefore };
})();
